spring.application.name=rent-payment-reminder-portal
server.port=8081

# SQLite database (persists across restarts in project root)
spring.datasource.url=jdbc:sqlite:./rentdb.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# MySQL (staging/prod) - set real credentials via environment variables
# spring.datasource.url=jdbc:mysql://localhost:3306/rentdb
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASS}

# Suppress harmless Selenium CDP (Chrome DevTools Protocol) version mismatch warnings
logging.level.org.openqa.selenium.devtools=OFF
logging.level.org.openqa.selenium.chromium.ChromiumDriver=ERROR

