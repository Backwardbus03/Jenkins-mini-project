spring.application.name=rent-payment-reminder-portal
server.port=8081

# SQLite database (persists across restarts in project root)
spring.datasource.url=jdbc:sqlite:./rentdb.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# MySQL (staging/prod) - set real credentials via environment variables
# spring.datasource.url=jdbc:mysql://localhost:3306/rentdb
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASS}

# Mail Configuration (Defaults to Mailtrap sandbox; disabled by default in CI/CD)
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Rent & Electricity Reminder Schedule (Daily at 9 AM, default disabled for tests)
app.reminder.cron=${REMINDER_CRON:0 0 9 * * *}
app.reminder.enabled=${REMINDER_ENABLED:false}
app.portal.base-url=${PORTAL_BASE_URL:http://localhost:8081}


