spring.application.name=rent-payment-reminder-portal
server.port=8080

# Local dev default: in-memory H2. Switch to MySQL for staging/prod
# by uncommenting the block below and setting real credentials via
# environment variables (never commit real credentials).
spring.datasource.url=jdbc:h2:mem:rentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

