<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Rent Reminder Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🏠 RentPortal</h1>
            <p>Sign in to manage your property, lease &amp; bills</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            ⚠️ Invalid email or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            ✓ You have been logged out.
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Email Address</label>
                <input id="username" name="username" type="email" class="form-control"
                       placeholder="you@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control"
                       placeholder="••••••••" required>
            </div>
            <button id="btn-login" type="submit" class="btn btn-primary w-full" style="justify-content:center;">
                Sign In →
            </button>
        </form>

        <div class="auth-divider">or</div>

        <div class="auth-footer">
            New tenant?
            <a th:href="@{/portal/register}" style="font-weight:600; color:var(--accent-light);">Create a tenant account</a>
        </div>

        <div class="alert alert-info" style="font-size:0.78rem; margin-top:1.25rem; line-height:1.5;">
            <div>🔑 <strong>Owner login:</strong> owner@rentportal.com / owner123</div>
            <div>🔑 <strong>Tenant demo:</strong> tenant@rentportal.com / tenant123</div>
        </div>
    </div>
</div>
</body>
</html>
