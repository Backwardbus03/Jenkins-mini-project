<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Rent Reminder Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div style="display:flex; justify-content:flex-end; margin-bottom:0.75rem;">
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()">☀️ Light Mode</button>
        </div>

        <div class="auth-logo">
            <h1>🏠 RentPortal</h1>
            <p>Sign in to manage your property, lease &amp; bills</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <span>⚠️ Invalid email or password. Please try again.</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            <span>✓ You have been logged out.</span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Email Address</label>
                <input id="username" name="username" type="email" class="form-control"
                       placeholder="you@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-action">
                    <input id="password" name="password" type="password" class="form-control"
                           placeholder="••••••••" required>
                    <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility('password', this)" title="Show password">👁️</button>
                </div>
            </div>
            <button id="btn-login" type="submit" class="btn btn-primary w-full" style="justify-content:center; padding:0.75rem;">
                Sign In →
            </button>
        </form>

        <div class="auth-divider">or</div>

        <div class="auth-footer">
            New tenant?
            <a th:href="@{/portal/register}" style="font-weight:600; color:var(--accent-light);">Create a tenant account</a>
        </div>

        <!-- Interactive 1-Click Demo Login Box -->
        <div class="demo-box">
            <div class="demo-box-title">⚡ Quick Demo Sign-In (Click to Fill)</div>
            <div class="demo-chips">
                <div class="demo-chip" onclick="fillDemoLogin('owner@rentportal.com', 'owner123')" title="Click to fill credentials">
                    <span>👑 <strong>Owner Portal</strong></span>
                    <code>owner@rentportal.com</code>
                </div>
                <div class="demo-chip" onclick="fillDemoLogin('tenant@rentportal.com', 'tenant123')" title="Click to fill credentials">
                    <span>👤 <strong>Tenant Portal</strong></span>
                    <code>tenant@rentportal.com</code>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
