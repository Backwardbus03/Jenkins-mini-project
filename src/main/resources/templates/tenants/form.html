<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tenant — Rent Reminder Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/tenants}">🏠 RentPortal <span style="font-size:0.7rem; opacity:0.7;">Owner</span></a>
    <div class="navbar-links">
        <a th:href="@{/tenants}">Tenants</a>
        <a th:href="@{/payments/new}">Add Payment</a>
        <a th:href="@{/payments/summary}">Summary</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm btn-logout" style="background:none; cursor:pointer;">Sign Out</button>
        </form>
    </div>
</nav>

<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Add New Tenant</h1>
        <p class="page-subtitle">Fill in the tenant details — a portal invitation will automatically be created</p>
    </div>

    <div class="card form-card" style="max-width:580px; margin:0;">
        <form th:action="@{/tenants}" th:object="${tenant}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="tenant-name">Full Name *</label>
                <input id="tenant-name" type="text" th:field="*{name}" class="form-control" placeholder="Jane Smith" required>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:var(--accent-red); font-size:0.8rem;"></span>
            </div>
            <div class="form-group">
                <label for="tenant-email">Email Address *</label>
                <input id="tenant-email" type="email" th:field="*{email}" class="form-control" placeholder="jane@example.com" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:var(--accent-red); font-size:0.8rem;"></span>
                <span style="font-size:0.78rem; color:var(--text-muted); display:block; margin-top:0.35rem;">
                    ✉️ A portal invitation will automatically be linked to this email for the tenant to approve their tenancy.
                </span>
            </div>
            <div class="form-group">
                <label for="tenant-phone">Phone</label>
                <input id="tenant-phone" type="tel" th:field="*{phone}" class="form-control" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
                <label for="tenant-apt">Apartment Number *</label>
                <input id="tenant-apt" type="text" th:field="*{apartmentNumber}" class="form-control" placeholder="101" required>
                <span th:if="${#fields.hasErrors('apartmentNumber')}" th:errors="*{apartmentNumber}" style="color:var(--accent-red); font-size:0.8rem;"></span>
            </div>

            <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
                <button id="btn-save-tenant" type="submit" class="btn btn-primary">Save Tenant &amp; Send Invite</button>
                <a th:href="@{/tenants}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
