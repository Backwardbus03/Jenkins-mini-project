<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Summary - Rent Reminder Portal</title>
</head>
<body>
    <h1>Payment Summary</h1>
    <a th:href="@{/payments/new}">Add New Payment</a> | <a th:href="@{/payments/receipt}">Print Receipts</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tenant</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Month</th>
                <th>Year</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.id}">1</td>
                <td th:text="${payment.tenant.name}">John Doe</td>
                <td th:text="${payment.amount}">1000.0</td>
                <td th:text="${payment.date}">2023-01-01</td>
                <td th:text="${payment.month}">1</td>
                <td th:text="${payment.year}">2023</td>
                <td th:text="${payment.status}">Paid</td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/tenants}">Manage Tenants</a>
</body>
</html>
