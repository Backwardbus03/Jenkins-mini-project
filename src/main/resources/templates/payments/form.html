<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Payment — Rent Reminder Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/tenants}">🏠 RentPortal <span style="font-size:0.7rem; opacity:0.7;">Owner</span></a>
    <div class="navbar-links">
        <a th:href="@{/tenants}">Tenants</a>
        <a th:href="@{/payments/new}">Add Payment</a>
        <a th:href="@{/payments/summary}">Summary</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm btn-logout" style="background:none; cursor:pointer;">Sign Out</button>
        </form>
    </div>
</nav>

<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Record Payment</h1>
        <p class="page-subtitle">Record a rent payment or mark rent as overdue</p>
    </div>

    <div class="card" style="max-width:540px;">
        <form th:action="@{/payments}" th:object="${payment}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${#fields.hasErrors('month')}" class="alert alert-error" th:errors="*{month}"></div>

            <div class="form-group">
                <label for="pay-tenant">Tenant *</label>
                <select id="pay-tenant" th:field="*{tenant}" class="form-control" required>
                    <option value="">— Select Tenant —</option>
                    <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.name + ' (Apt ' + t.apartmentNumber + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="pay-amount">Amount (₹) *</label>
                <input id="pay-amount" type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="e.g. 15000" required>
                <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:var(--accent-red); font-size:0.8rem;"></span>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="pay-date">Date *</label>
                    <input id="pay-date" type="date" th:field="*{date}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="pay-status">Status *</label>
                    <select id="pay-status" th:field="*{status}" class="form-control" required>
                        <option value="Paid">Paid</option>
                        <option value="Overdue">Overdue (deducts from deposit)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="pay-month">Month (1–12) *</label>
                    <input id="pay-month" type="number" min="1" max="12" th:field="*{month}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="pay-year">Year *</label>
                    <input id="pay-year" type="number" th:field="*{year}" class="form-control" placeholder="2024" required>
                </div>
            </div>

            <div id="overdue-notice" style="display:none; margin-bottom:1rem; padding:0.75rem 1rem; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); border-radius:10px; font-size:0.85rem; color:#fca5a5;">
                ⚠️ Marking as <strong>Overdue</strong> will automatically deduct this amount from the tenant's deposit balance.
            </div>

            <div style="display:flex; gap:0.75rem; margin-top:1rem;">
                <button id="btn-save-payment" type="submit" class="btn btn-primary">Save Payment</button>
                <a th:href="@{/payments/summary}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('pay-status').addEventListener('change', function() {
    document.getElementById('overdue-notice').style.display =
        this.value === 'Overdue' ? 'block' : 'none';
});

const dateInput = document.getElementById('pay-date');
const monthInput = document.getElementById('pay-month');
const yearInput = document.getElementById('pay-year');
if (dateInput && !dateInput.value) {
    const today = new Date();
    dateInput.value = today.toISOString().split('T')[0];
    if (!monthInput.value) monthInput.value = today.getMonth() + 1;
    if (!yearInput.value) yearInput.value = today.getFullYear();
}
</script>
</body>
</html>
