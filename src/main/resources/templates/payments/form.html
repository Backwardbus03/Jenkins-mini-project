<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Payment - Rent Reminder Portal</title>
</head>
<body>
    <h1>Add New Payment</h1>
    <form th:action="@{/payments}" th:object="${payment}" method="post">
        <div th:if="${#fields.hasErrors('month')}" th:errors="*{month}" style="color:red;"></div>
        <div>
            <label>Tenant:</label>
            <select th:field="*{tenant}">
                <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div>
            <label>Amount:</label>
            <input type="number" step="0.01" th:field="*{amount}" required />
            <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:red;"></span>
        </div>
        <div>
            <label>Date:</label>
            <input type="date" th:field="*{date}" required />
        </div>
        <div>
            <label>Month (1-12):</label>
            <input type="number" min="1" max="12" th:field="*{month}" required />
        </div>
        <div>
            <label>Year:</label>
            <input type="number" th:field="*{year}" required />
        </div>
        <div>
            <label>Status:</label>
            <select th:field="*{status}">
                <option value="Paid">Paid</option>
                <option value="Overdue">Overdue</option>
            </select>
        </div>
        <button type="submit">Save</button>
    </form>
    <a th:href="@{/payments/summary}">Back to Summary</a>
</body>
</html>
