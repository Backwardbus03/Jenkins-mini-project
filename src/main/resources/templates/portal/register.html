<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Registration — Rent Reminder Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card" style="max-width:520px;">
        <div style="display:flex; justify-content:flex-end; margin-bottom:0.75rem;">
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()">☀️ Light Mode</button>
        </div>

        <div class="auth-logo">
            <h1>🏠 RentPortal</h1>
            <p>Create your tenant self-service account</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span>⚠️ <span th:text="${error}">Error message</span></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <span>✓ <span th:text="${success}">Success</span></span>
        </div>

        <form th:action="@{/portal/register}" method="post">
            <div class="form-group">
                <label for="reg-name">Full Name *</label>
                <input id="reg-name" name="name" type="text" class="form-control"
                       placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address *</label>
                <input id="reg-email" name="email" type="email" class="form-control"
                       placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input id="reg-phone" name="phone" type="tel" class="form-control"
                       placeholder="+91 98765 43210">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="reg-password">Password *</label>
                    <div class="input-with-action">
                        <input id="reg-password" name="password" type="password" class="form-control"
                               placeholder="Min. 6 chars" required minlength="6">
                        <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility('reg-password', this)" title="Show password">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirm Password *</label>
                    <div class="input-with-action">
                        <input id="reg-confirm" name="confirmPassword" type="password" class="form-control"
                               placeholder="Repeat password" required minlength="6">
                        <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility('reg-confirm', this)" title="Show password">👁️</button>
                    </div>
                </div>
            </div>

            <button id="btn-register" type="submit" class="btn btn-primary w-full" style="justify-content:center; margin-top:0.5rem; padding:0.75rem;">
                Create Account →
            </button>
        </form>

        <div class="auth-divider">already have an account?</div>

        <div class="auth-footer">
            <a th:href="@{/login}">← Back to Sign In</a>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
