[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
forks                = 5
timeout              = 30
stdout_callback      = default
result_format        = yaml
# Per-run log files are selected with the ANSIBLE_LOG_PATH environment variable
# (see lab/lab.ps1), so each execution gets its own evidence file under logs/.

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15

[privilege_escalation]
become        = True
become_method = sudo
