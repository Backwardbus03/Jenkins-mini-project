name: rent-lab

services:
  # Ansible control node
  control:
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: rent-control
    volumes:
      - ..:/ansible
      - keys:/keys
    networks: [lab]

  # Target node (stand-in for a fresh VM)
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: rent-node
    hostname: rent-node
    privileged: true      # required to run systemd as PID 1 in Docker Desktop
    cgroup: host
    tmpfs: [/run, /run/lock]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "8082:8081"       # portal reachable at http://localhost:8082 (8081 is used by the Jenkins Docker deploy)
    networks: [lab]

volumes:
  keys:

networks:
  lab:
