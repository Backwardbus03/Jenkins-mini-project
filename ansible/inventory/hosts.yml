---
# Inventory for the Rent Payment Reminder Portal.
# The "lab" node is a systemd-enabled Ubuntu 22.04 container that stands in for a VM
# (see ansible/lab/). For a real server, add it under `rent_portal` with its own
# ansible_host / ansible_user and keep the same group_vars.
all:
  children:
    rent_portal:
      hosts:
        rent-node:
          ansible_host: rent-node
          ansible_user: ansible
          ansible_ssh_private_key_file: /keys/id_ed25519
