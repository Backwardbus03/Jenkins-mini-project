---
# Server prerequisites: packages, service account, directories, config, systemd unit,
# logrotate, optional firewall. Every task is declarative so a second run reports changed=0.

- name: Install required OS packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create application service account (no login shell)
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    home: "{{ app_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    comment: "Rent Payment Reminder Portal service account"
    state: present

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_root }}",          owner: root,         group: "{{ app_group }}", mode: "0755" }
    - { path: "{{ app_releases_dir }}",  owner: root,         group: "{{ app_group }}", mode: "0755" }
    - { path: "{{ app_data_dir }}",      owner: "{{ app_user }}", group: "{{ app_group }}", mode: "0750" }
    - { path: "{{ app_log_dir }}",       owner: "{{ app_user }}", group: "{{ app_group }}", mode: "0750" }
    - { path: "{{ app_conf_dir }}",      owner: root,         group: "{{ app_group }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Render environment file (runtime configuration)
  ansible.builtin.template:
    src: rent-portal.env.j2
    dest: "{{ app_env_file }}"
    owner: root
    group: "{{ app_group }}"
    mode: "0640"
  notify: Restart rent-portal

- name: Install systemd unit
  ansible.builtin.template:
    src: rent-portal.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart rent-portal

- name: Install logrotate policy
  ansible.builtin.template:
    src: rent-portal.logrotate.j2
    dest: "/etc/logrotate.d/{{ app_service_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Firewall rules (only when manage_firewall is true)
  when: manage_firewall | bool
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH and application port
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ ssh_port }}"
        - "{{ app_port }}"

    - name: Enable ufw (default deny incoming)
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
